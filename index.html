<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stuck In Me</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,600;1,600&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        display: block;
        cursor: pointer;
      }
      /* force the fonts to load before the canvas needs them */
      .preload {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <span class="preload" style="font-family: Cinzel; font-weight: 700">.</span>
    <span class="preload" style="font-family: 'Cormorant Garamond'; font-weight: 600">.</span>
    <span class="preload" style="font-family: 'Cormorant Garamond'; font-weight: 600; font-style: italic">.</span>
    <canvas id="game"></canvas>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
